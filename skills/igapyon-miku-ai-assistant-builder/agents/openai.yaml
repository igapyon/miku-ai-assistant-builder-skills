interface:
  display_name: "Miku AI Assistant Builder (Beta)"
  short_description: "ベータ版: Agent Builder向け配備資料を二段階で作成"
  default_prompt: "Use the beta $igapyon-miku-ai-assistant-builder skill for Microsoft 365 Copilot Agent Builder or Google Gemini Gem Classic. Before a new conversion, resolve the target service and exact automatic-input folder scope from direct user statements, quoted prior choices, or a single unambiguous inference from user-provided facts. State each adopted value and its basis, then proceed without waiting only when every required value is resolved. Ask only for unresolved, ambiguous, conflicting, or unsupported values; never infer a value only from the current directory, repository root, open files, attachments, filenames, or general knowledge. Create each new run directory with the bundled create-run-directory script so its timestamp comes from the OS local clock. Treat eligible JSON and JSONL as one-input-one-XLSX candidates. In stage 2, inspect each JSON input, present and validate an explicit mapping for human review, fix its SHA-256 in the conversion plan, and do not duplicate that input through miku-text-bundle. Create the fixed conversion plan and Node.js runner, then use that runner for the first conversion. Reuse the same runner only for content-only refreshes whose input paths, mappings, file counts, basenames, and formats remain fixed. For a repeat that reconsiders prior choices, confirm the recorded choices and create a new timestamped run directory instead of reusing prior work."
