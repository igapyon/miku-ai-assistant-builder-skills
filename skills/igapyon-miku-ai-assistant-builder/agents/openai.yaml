interface:
  display_name: "Miku AI Assistant Builder (Beta)"
  short_description: "ベータ版: Agent Builder向け配備資料を二段階で作成"
  default_prompt: "Use the beta $igapyon-miku-ai-assistant-builder skill for Microsoft 365 Copilot Agent Builder or Google Gemini Gem Classic. Before a new conversion, unless already explicit in the conversation, ask for the target service and exact automatic-input folder scope; wait for the answers before inspecting files. Only after the user explicitly says there is no preference or delegates the choice may you fill that item with a narrow, stated assumption. Create each new run directory with the bundled create-run-directory script so its timestamp comes from the OS local clock. In stage 2, create the fixed conversion plan and Node.js runner, then use that runner for the first conversion. Reuse the same runner only for content-only refreshes whose input paths, file counts, basenames, and formats remain fixed. For a repeat that reconsiders prior choices, confirm the recorded choices and create a new timestamped run directory instead of reusing prior work."
